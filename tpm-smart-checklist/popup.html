<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPM Smart Checklist</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="is-popup">
  <div class="popup-shell">
    <header class="popup-header">
      <div class="brand-row">
        <span class="brand-mark" data-icon="clipboard-check" data-size="16"></span>
        <div class="brand-text-wrap">
          <h1 class="popup-title">TPM Smart Checklist</h1>
          <span id="popup-version" class="version-pill">v1.4.0</span>
        </div>
      </div>

      <div class="header-actions">
        <button
          id="theme-toggle-btn"
          type="button"
          class="icon-btn"
          title="Ganti Tema Terang / Gelap"
          aria-label="Ganti Tema"
        ></button>
        <button
          id="open-options-btn"
          type="button"
          class="icon-btn"
          title="Buka Pengaturan Lengkap"
          aria-label="Pengaturan"
        ></button>
      </div>
    </header>

    <section class="operator-card" aria-label="Pilih Operator">
      <div class="operator-seg" role="tablist" aria-label="Preset Operator">
        <button type="button" role="tab" class="op-seg-btn is-active" data-operator="op1">Operator 1</button>
        <button type="button" role="tab" class="op-seg-btn" data-operator="op2">Operator 2</button>
        <button type="button" role="tab" class="op-seg-btn" data-operator="op3">Operator 3</button>
      </div>

      <div class="preset-meta-row">
        <span id="preset-area-label" class="preset-area">LAPANGAN 1 (GROUND)</span>
        <div class="preset-counts">
          <span id="running-count-chip" class="count-chip is-running">30 Running</span>
          <span id="standby-count-chip" class="count-chip is-standby">0 Standby</span>
        </div>
      </div>
    </section>

    <div class="field-group">
      <label for="schedule-filter" class="field-label">Filter Jadwal / Shift (web TPM)</label>
      <select id="schedule-filter" class="control-select">
        <option value="all">Semua Jadwal</option>
        <option value="morning_shift">Morning Shift</option>
        <option value="afternoon_shift">Afternoon Shift</option>
        <option value="night_shift">Night Shift</option>
        <option value="every_shift">Every Shift</option>
        <option value="weekly">Weekly</option>
        <option value="optional">Optional</option>
      </select>
      <label class="checkbox-row" for="auto-detect-shift">
        <input id="auto-detect-shift" type="checkbox" checked />
        <span>Auto-detect shift sesuai jam</span>
      </label>
      <label class="checkbox-row" for="include-every-shift">
        <input id="include-every-shift" type="checkbox" checked />
        <span>Sertakan task Every Shift</span>
      </label>
      <label class="checkbox-row" for="auto-show-all-rows">
        <input id="auto-show-all-rows" type="checkbox" checked />
        <span>Auto-tampilkan semua baris (300+)</span>
      </label>
    </div>

    <div class="action-grid">
      <button id="dry-run-btn" type="button" class="btn btn-dry"></button>
      <button id="clear-dry-run-btn" type="button" class="btn btn-clear" title="Bersihkan sorotan Dry Run"></button>
      <button id="execute-btn" type="button" class="btn btn-primary"></button>
    </div>

    <div id="exec-progress-wrap" class="progress-wrap is-hidden" aria-live="polite">
      <div id="exec-progress-text" class="progress-text">Memproses 0 / 0 baris...</div>
      <div class="progress-track">
        <div id="exec-progress-bar" class="progress-fill"></div>
      </div>
    </div>

    <section class="summary-box" aria-label="Ringkasan Eksekusi">
      <div id="summary-status" class="summary-status">
        Siap memindai tabel checklist pada tab aktif.
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-name">Total Discan</span>
          <span id="stat-scanned" class="stat-val">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-name">Set → Executed</span>
          <span id="stat-executed" class="stat-val is-exec">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-name">Set → Not Executed</span>
          <span id="stat-not-executed" class="stat-val is-not-exec">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-name">Sudah Sesuai</span>
          <span id="stat-already" class="stat-val">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-name">Tidak Tersentuh</span>
          <span id="stat-untouched" class="stat-val">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-name">Sisa Unset (Aktif)</span>
          <span id="stat-remaining-unset" class="stat-val">0</span>
        </div>
      </div>
    </section>

    <footer class="app-footer">© 2026 — Developed by FIKRI</footer>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
