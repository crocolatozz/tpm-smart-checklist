<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPM Smart Checklist</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="is-popup">
  <div class="popup-shell">
    <header class="popup-header">
      <div class="brand-row">
        <img src="./icons/icon.svg" alt="TPM Smart Checklist" class="brand-logo" width="28" height="28" />
        <div class="brand-text-wrap">
          <h1 class="popup-title">TPM Smart Checklist</h1>
          <div class="brand-sub-row">
            <span id="popup-version" class="version-pill">v2.3.0</span>
            <span id="popup-dev-badge" class="dev-badge is-hidden"></span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button
          id="theme-toggle-btn"
          type="button"
          class="icon-btn"
          title="Ganti Tema Terang / Gelap"
          aria-label="Ganti Tema"
        ></button>
        <button
          id="open-options-btn"
          type="button"
          class="icon-btn"
          title="Buka Pengaturan Lengkap"
          aria-label="Pengaturan"
        ></button>
      </div>
    </header>

    <!-- Active Web Context Card -->
    <section id="context-card" class="context-card" aria-label="Konteks Web Aktif">
      <div class="context-row">
        <span class="context-key">Web Aktif</span>
        <span id="ctx-page-badge" class="context-val-badge is-warn">Memeriksa...</span>
      </div>
      <div class="context-row">
        <span class="context-key">Tanggal Aktif</span>
        <span id="ctx-date-val" class="context-date-val">-</span>
      </div>
      <div id="execute-guard-hint" class="guard-hint is-hidden">
        Buka web checklist TPM Op. 1, 2, atau 3 dulu.
      </div>
    </section>

    <!-- Active Operator Status Summary Pills -->
    <section class="status-summary-card" aria-label="Ringkasan Status Equipment">
      <div id="preset-counts" class="preset-counts is-muted">
        <span id="running-count-chip" class="count-chip is-running">0 RUNNING</span>
        <span id="standby-count-chip" class="count-chip is-standby">0 STANDBY</span>
        <span id="ignore-count-chip" class="count-chip is-ignore">0 IGNORE</span>
      </div>
    </section>

    <div class="field-group">
      <label for="schedule-filter" class="field-label">Filter Jadwal / Shift</label>
      <select id="schedule-filter" class="control-select">
        <option value="morning_shift">Morning Shift</option>
        <option value="afternoon_shift">Afternoon Shift</option>
        <option value="night_shift">Night Shift</option>
      </select>
    </div>

    <div class="action-grid">
      <button id="dry-run-btn" type="button" class="btn btn-dry dev-only"></button>
      <button id="execute-btn" type="button" class="btn btn-primary"></button>
    </div>

    <div id="exec-progress-wrap" class="progress-wrap is-hidden" aria-live="polite">
      <div id="exec-progress-text" class="progress-text">Memproses 0 / 0 baris...</div>
      <div class="progress-track">
        <div id="exec-progress-bar" class="progress-fill"></div>
      </div>
    </div>

    <div id="popup-feedback" class="popup-feedback is-hidden" role="status" aria-live="polite"></div>

    <footer class="app-footer">© 2026 — Developed by FIKRI</footer>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
