<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MV3 Demo Helper - Options</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #0f172a;
      background-color: #f1f5f9;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 28px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .meta {
      font-size: 12.5px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: #1e293b;
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #ffffff;
      color: #0f172a;
      font-size: 14px;
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      color: #64748b;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      height: 38px;
      padding: 0 16px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #0f172a;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: #f8fafc;
    }

    button.primary {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    button.primary:hover {
      background-color: #1d4ed8;
    }

    .feed {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .feed-title {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 600;
    }

    pre {
      margin: 0;
      padding: 12px 14px;
      border-radius: 6px;
      background-color: #0f172a;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 id="options-title">Pengaturan MV3 Demo Helper</h1>
      <span id="options-url" class="meta"></span>
    </div>

    <form id="options-form">
      <div class="field">
        <label for="opt-note">Catatan Global (key: demoNote)</label>
        <input id="opt-note" type="text" placeholder="Masukkan catatan default..." />
        <div class="hint">
          Perubahan di sini otomatis disinkronkan secara real-time ke Popup melalui <code>chrome.storage.onChanged</code>.
        </div>
      </div>

      <div class="field">
        <label for="opt-category">Kategori Default Autofill (key: defaultCategory)</label>
        <select id="opt-category">
          <option value="Ekstensi MV3">Ekstensi MV3</option>
          <option value="Otomasi QA">Otomasi QA</option>
          <option value="Riset Data">Riset Data</option>
          <option value="Integrasi API">Integrasi API</option>
        </select>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Simpan Pengaturan</button>
        <button id="clear-btn" type="button">Hapus Storage Ekstensi</button>
        <button id="send-msg-btn" type="button">Kirim Pesan Tes ke Target</button>
        <button id="back-popup-btn" type="button">Kembali ke Popup</button>
      </div>
    </form>

    <div class="feed">
      <h2 class="feed-title">Status &amp; Event Log (chrome.storage.onChanged)</h2>
      <pre id="options-log">Memuat konfigurasi...</pre>
    </div>
  </div>

  <script>
    (function () {
      const titleEl = document.getElementById('options-title');
      const urlEl = document.getElementById('options-url');
      const noteEl = document.getElementById('opt-note');
      const catEl = document.getElementById('opt-category');
      const logEl = document.getElementById('options-log');

      const manifest = chrome.runtime.getManifest();
      titleEl.textContent = 'Pengaturan ' + (manifest.name || 'Ekstensi');
      urlEl.textContent = chrome.runtime.getURL('options.html');

      function writeLog(label, data) {
        const time = new Date().toLocaleTimeString();
        logEl.textContent = '[' + time + '] ' + label + '\n' + JSON.stringify(data, null, 2);
      }

      function loadSettings() {
        chrome.storage.local.get(
          { demoNote: 'Entri dari Popup', defaultCategory: 'Ekstensi MV3' },
          function (items) {
            noteEl.value = items.demoNote || '';
            catEl.value = items.defaultCategory || 'Ekstensi MV3';
            writeLog('Konfigurasi dimuat dari chrome.storage.local', items);
          }
        );
      }

      loadSettings();

      chrome.storage.onChanged.addListener(function (changes, areaName) {
        if (areaName !== 'local') return;
        if (changes.demoNote) {
          noteEl.value = changes.demoNote.newValue || '';
        }
        if (changes.defaultCategory && changes.defaultCategory.newValue) {
          catEl.value = changes.defaultCategory.newValue;
        }
        writeLog('Event chrome.storage.onChanged diterima', changes);
      });

      document.getElementById('options-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const payload = {
          demoNote: noteEl.value.trim(),
          defaultCategory: catEl.value,
          updatedAt: new Date().toLocaleTimeString()
        };
        chrome.storage.local.set(payload, function () {
          writeLog('Pengaturan berhasil disimpan', payload);
        });
      });

      document.getElementById('clear-btn').addEventListener('click', function () {
        chrome.storage.local.clear(function () {
          noteEl.value = '';
          catEl.value = 'Ekstensi MV3';
          writeLog('chrome.storage.local.clear() dijalankan', {});
        });
      });

      document.getElementById('send-msg-btn').addEventListener('click', function () {
        chrome.tabs.sendMessage(
          1,
          {
            action: 'AUTOFILL_SAMPLE',
            data: {
              nama: noteEl.value.trim() || 'Entri dari Options',
              kategori: catEl.value,
              status: 'Aktif'
            }
          },
          function (res) {
            writeLog('Respons dari Target Web via chrome.tabs.sendMessage', res);
          }
        );
      });

      document.getElementById('back-popup-btn').addEventListener('click', function () {
        chrome.tabs.create({ url: chrome.runtime.getURL('popup.html') });
      });
    })();
  </script>
</body>
</html>
